# This is a basic CI workflow for your Hardhat project
name: Solidity CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events for main
  push:
    branches: ["main", "Escrowvault"]
  # Triggers the workflow on pull request events targeting main
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks-out repository under $GITHUB_WORKSPACE
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Sets up Node.js in the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install project dependencies using npm
      - name: Install dependencies
        run: npm install

      # Step 4: Compile the Solidity contracts
      - name: Compile contracts
        run: npx hardhat compile

      # Step 5: Run the tests
      - name: Run tests
        run: npx hardhat test
